<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Похожие статьи - макет конца статьи</title>
  <style>
    @font-face {
      font-family: "TT Masters";
      src: url("../assets/fonts/TTMasters-Regular.ttf") format("truetype");
      font-weight: 300 700;
      font-display: swap;
    }

    :root {
      color-scheme: light;
      --background: #f3f3f1;
      --ink: #2b2b2b;
      --muted: #575953;
      --line: #d9d9d4;
      --blue: #395a64;
      --accent: #ff9800;
      --fiber: repeating-linear-gradient(0deg, transparent 0 7px, rgb(54 64 63 / 0.023) 7px 8px),
        repeating-linear-gradient(18deg, transparent 0 20px, rgb(57 90 100 / 0.028) 20px 21px, transparent 21px 39px);
      font: 400 16px/1.4 "TT Masters", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--background); color: var(--ink); }
    h2, p { margin: 0; }
    h2 { font-weight: 400; line-height: 1.03; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid #a75a00; outline-offset: 4px; }
    ul { list-style: none; margin: 0; padding: 0; }

    .preview {
      width: calc(100% - 56px);
      margin-inline: auto;
      padding: clamp(24px, 5vw, 68px) 0 108px;
    }

    .article-ending { max-width: 920px; margin-inline: auto; padding-inline-start: 2px; }
    .article-ending-related { margin-top: 48px; }
    @media (max-width: 720px) {
      .preview { width: calc(100% - 36px); }
    }
    @media (max-width: 620px) {
      .article-ending-related { margin-top: 32px; }
    }

    .preview-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 4px 20px;
      margin-bottom: clamp(26px, 4vw, 52px);
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font: 400 13px/1.45 system-ui, sans-serif;
    }

    .preview-header strong {
      color: var(--ink);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .section-heading { display: grid; gap: 8px; }
    .summary { color: var(--muted); }
    .summary { font-size: 17px; line-height: 1.42; }

    .topic {
      color: var(--blue);
      font-size: 13px;
      letter-spacing: 0.055em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    /* Вид сверху: короткая перемычка заканчивается в отверстии листа. */
    .ring-binding {
      position: relative;
      isolation: isolate;
      --rail-left: 12px;
      --rail-width: 18px;
      --ring-left: -26px;
      --hole-x: 13px;
      --hole-width: 10px;
      --hole-height: 12px;
      --pin-height: 7px;
      --pin-tone: #adbcc1;
      --leaf-edge: #c8d7dc;
      --leaf-shadow: #e6edef;
      padding: clamp(20px, 3.5vw, 46px);
      border: 1px solid #b9ced5;
      box-shadow: 3px 3px 0 #e6edef, 4px 4px 0 #c8d4d8, 0 14px 30px rgb(43 66 74 / 0.11);
    }

    .ring-binding .section-heading { position: relative; align-content: start; margin-bottom: clamp(19px, 3vw, 34px); }
    .ring-linen {
      border-radius: 10px 16px 12px 9px;
      background:
        repeating-linear-gradient(4deg, transparent 0 3px, rgb(71 107 122 / 0.026) 3px 4px),
        repeating-linear-gradient(92deg, transparent 0 3px, rgb(71 107 122 / 0.021) 3px 4px),
        #f6f8f8;
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    .ring-linen::before {
      position: absolute;
      inset: 4px;
      border: 1px solid rgb(155 181 190 / 0.32);
      border-radius: 6px 12px 8px 5px;
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.64);
      content: "";
      pointer-events: none;
    }

    .ring-linen:is(:hover, :has(.sheet-link:focus-visible)) {
      border-color: #c8c0b4;
      box-shadow: 3px 4px 0 #efede7, 4px 5px 0 #d7d0c4, 0 17px 34px rgb(70 58 42 / 0.14);
    }

    .ring-linen .sheet-action { position: relative; justify-self: start; color: #2f6075; }
    .ring-linen .sheet-action::after {
      position: absolute;
      bottom: -1px;
      left: 13px;
      right: 0;
      height: 2px;
      background: #74736b;
      clip-path: polygon(0 44%, 35% 7%, 70% 24%, 100% 0, 98% 72%, 34% 88%, 2% 100%);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 230ms ease-out 65ms;
      content: "";
    }
    .ring-linen .sheet-link:is(:hover, :focus-visible, :active) .sheet-action::after { transform: scaleX(1); }

    @media (hover: none), (pointer: coarse) {
      .ring-linen .sheet-action::after { transform: scaleX(1); transition: none; }
    }

    .ring-linen .section-heading h2 {
      position: relative;
      justify-self: start;
      font-size: clamp(42px, 5.2vw, 72px);
      letter-spacing: -0.035em;
      padding: clamp(14px, 2vw, 22px) clamp(17px, 2.5vw, 33px);
      transform: rotate(-1.5deg);
      border: 1px solid transparent;
    }
    .ring-linen .linen-title-paper {
      display: block;
      position: absolute;
      inset: -1px;
      z-index: -1;
      filter: drop-shadow(1px 2px 1px rgb(67 63 49 / 0.15));
      pointer-events: none;
    }
    .linen-title-paper::before {
      position: absolute;
      inset: 0;
      border: 1px solid #d8d7ca;
      background: var(--fiber), #faf8ed;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 3px),
        93% calc(100% - 2px), 86% 100%, 79% calc(100% - 2px), 71% calc(100% - 1px),
        62% 100%, 53% calc(100% - 2px), 44% calc(100% - 1px), 35% 100%,
        27% calc(100% - 2px), 18% 100%, 9% calc(100% - 2px), 0 calc(100% - 1px));
      content: "";
    }
    .linen-title-paper::after {
      position: absolute;
      right: 2%;
      bottom: -1px;
      width: 39%;
      height: 7px;
      z-index: -1;
      background: rgb(75 67 51 / 0.24);
      border-radius: 50%;
      filter: blur(3px);
      transform: rotate(1deg);
      content: "";
    }
    .ring-linen .section-heading h2::before,
    .ring-linen .section-heading h2::after {
      position: absolute;
      left: calc(50% - 6px);
      top: 1px;
      width: 12px;
      height: 12px;
      content: "";
      border: 1px solid;
      border-radius: 50%;
      pointer-events: none;
    }
    .ring-linen .section-heading h2::before {
      border-color: #ab772e;
      background: radial-gradient(circle at 35% 30%, #ffe0a9, #ecac56 52%, #c88c39);
      box-shadow: 1px 2px 1px rgb(67 63 49 / 0.22);
    }
    .ring-linen .section-heading h2::after {
      border-color: #81796d;
      background: radial-gradient(circle at 34% 28%, #fff 0 10%, #d8d4cc 26%, #aaa397 58%, #756d62);
      opacity: 0;
      transition: opacity 180ms ease;
    }
    .ring-linen:has(.sheet-link:focus-visible) .section-heading h2::after { opacity: 1; }
    @media (hover: hover) and (pointer: fine) {
      .ring-linen:hover .section-heading h2::after { opacity: 1; }
    }

    .ring-linen .section-heading {
      padding-right: 108px;
      min-height: 70px;
    }
    .ring-linen .cup-mark {
      position: absolute;
      top: 50%;
      right: 3px;
      width: 85px;
      height: 78px;
      transform: translateY(-50%);
      pointer-events: none;
    }
    .cup-mark::before, .cup-mark::after {
      position: absolute;
      inset: 0 8px 7px 0;
      border: 2px solid rgb(143 100 56 / 0.36);
      border-width: 1px 3px 2px 1px;
      border-radius: 46% 54% 49% 51%;
      box-shadow: inset -2px -1px 2px rgb(154 110 64 / 0.14);
      transform: rotate(-12deg);
      mask-image: conic-gradient(transparent 0 36deg, #000 52deg 155deg, transparent 159deg 163deg, #000 169deg 279deg, transparent 310deg);
      content: "";
    }
    .cup-mark::before {
      inset: 7px 0 0 8px;
      transform: rotate(10deg);
      opacity: 0.34;
      mask-image: conic-gradient(transparent 0 54deg, #000 68deg 138deg, transparent 151deg 175deg, #000 188deg 310deg, transparent 325deg);
    }
    @media (max-width: 620px) {
      .ring-linen .section-heading { padding-right: 0; }
      .ring-linen .cup-mark {
        position: relative;
        inset: auto;
        grid-row: 1;
        justify-self: end;
        width: 64px;
        height: 57px;
        transform: none;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .ring-linen .sheet-action::after,
      .ring-linen .section-heading h2::after,
      .ring-linen, .ring-linen .sheet-link { transition: none; }
    }
    .ring-list { position: relative; padding: 9px 15px 13px 47px; }
    .ring-list ul { display: grid; gap: 9px; }
    .ring-spine {
      position: absolute;
      inset: 0 auto 0 var(--rail-left);
      width: var(--rail-width);
      border: 1px solid #a2b2b8;
      border-radius: 7px;
      background:
        repeating-linear-gradient(0deg, transparent 0 2px, rgb(43 66 74 / 0.045) 2px 3px),
        linear-gradient(90deg, #a4b4bb, #dbe4e7 25%, #d0dce0 62%, #aabcc2);
      box-shadow: inset 1px 0 1px rgb(255 255 255 / 0.65), 1px 2px 4px rgb(43 66 74 / 0.18);
      pointer-events: none;
    }

    .ring-list li { position: relative; min-width: 0; }
    .ring-hardware {
      position: absolute;
      z-index: 2;
      top: 50%;
      left: var(--ring-left);
      width: calc(var(--hole-x) - var(--ring-left) + 2px);
      pointer-events: none;
    }

    .ring-loop {
      position: absolute;
      inset: calc(var(--pin-height) / -2) 0 auto;
      height: var(--pin-height);
      border: 1px solid rgb(79 83 79 / 0.32);
      border-radius: 3px;
      background: var(--pin-tone);
      box-shadow: inset 0 1px rgb(255 255 255 / 0.5), 0 1px 1px rgb(50 50 44 / 0.19);
    }
    .ring-linen .ring-loop {
      background:
        linear-gradient(90deg, transparent 78%, rgb(44 60 67 / 0.28)),
        linear-gradient(#dce8eb, #b5c6cd 45%, #8e9fa7);
    }
    .ring-linen .ring-loop::after {
      position: absolute;
      inset: 1px 5px auto 3px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.8) 25% 68%, transparent);
      content: "";
    }

    .sheet-link {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      gap: clamp(14px, 3vw, 35px);
      align-items: center;
      padding: 15px clamp(14px, 2.5vw, 27px) 15px 36px;
      border: 1px solid var(--leaf-edge);
      border-radius: 4px 6px 5px 4px;
      background: var(--fiber), #f9fcfc;
      box-shadow: 1px 2px 0 var(--leaf-shadow), 0 4px 8px rgb(43 66 74 / 0.08);
      transition: border-color 180ms ease, background-color 180ms ease, box-shadow 180ms ease;
    }

    .sheet-link:is(:hover, :focus-visible) {
      border-color: #c8c0b4;
      background-color: #fffaf3;
      box-shadow: 1px 2px 0 #efede7, 0 6px 14px rgb(70 58 42 / 0.14);
    }

    .sheet-link::before {
      position: absolute;
      top: calc(50% - var(--hole-height) / 2);
      left: calc(var(--hole-x) - var(--hole-width) / 2);
      width: var(--hole-width);
      height: var(--hole-height);
      border: 1px solid #aab8bd;
      border-radius: 50%;
      background: #87969b;
      box-shadow: inset 1px 2px 3px rgb(34 46 42 / 0.46), 0 1px 0 rgb(255 255 255 / 0.82);
      content: "";
      pointer-events: none;
    }
    .ring-linen .sheet-link::before {
      box-shadow: inset 1px 2px 3px rgb(33 49 57 / 0.64), 1px 1px 0 rgb(255 255 255 / 0.86);
    }

    .sheet-link .topic { margin-bottom: 5px; color: #6f716e; }
    .sheet-link h3 {
      margin: 0;
      font-size: clamp(22px, 2.4vw, 30px);
      font-weight: 400;
      line-height: 1.03;
      letter-spacing: -0.015em;
    }
    .sheet-copy { display: grid; gap: 7px; }
    .sheet-action { color: var(--blue); }
    .sheet-action::before {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin: 0 7px 2px 0;
      border-radius: 50%;
      background: var(--accent);
      content: "";
    }


    @media (max-width: 620px) {
      .preview-header { margin-bottom: 24px; }
      .ring-binding {
        --rail-left: 2px;
        --rail-width: 19px;
        --ring-left: -22px;
        --hole-x: 12px;
        --hole-width: 9px;
        padding: 18px 16px;
      }
      .ring-list { padding-left: 28px; padding-right: 3px; }
      .sheet-link { grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 12px 11px 12px 24px; }
    }

  </style>
</head>
<body>
  <main class="preview">
    <header class="preview-header">
      <strong>Макет конца статьи</strong>
    </header>
    <div id="stage"></div>
  </main>

  <template id="article-author-preview">
    <link rel="stylesheet" href="../styles.css">
    <style>
      .article-page .legal-document { padding-inline-start: 0; }
      .legal-document > .article-author { margin-top: 0; }
    </style>
    <div class="article-page">
      <div class="legal-document">
        <aside class="article-author" data-author-card="interactive" aria-label="Об авторе">
          <span class="article-author__stud" aria-hidden="true"></span><span class="article-author__stud" aria-hidden="true"></span>
          <button class="article-author__toggle article-author__fabric-tab" type="button" aria-expanded="false" aria-controls="article-author-pages" aria-label="Показать контакты Максима Мирошникова"><span class="article-author__toggle-text">Задать вопрос</span></button>
          <div class="article-author__pages" id="article-author-pages">
            <div class="article-author__page article-author__page--profile" aria-hidden="false">
              <div class="article-author__portrait"><img class="article-author__photo" src="../assets/author-avatar.jpg" alt="Максим Мирошников" width="192" height="192" loading="lazy" decoding="async" /></div>
              <div class="article-author__body">
                <p class="article-author__label">Автор статьи</p>
                <p class="article-author__name">Максим Мирошников</p>
                <p class="article-author__role">Специалист по платному трафику</p>
                <p class="article-author__text">Запускаю рекламу, создаю сайты и воронки, настраиваю аналитику и помогаю связать маркетинг с данными о заявках.</p>
                <div class="article-author__footer">
                  <div class="article-author__proofs" aria-label="Опыт и результаты">
                    <div class="article-author__proof"><strong>10+</strong><span>лет практики</span></div>
                    <div class="article-author__proof"><strong>40+</strong><span>кейсов</span></div>
                    <div class="article-author__proof"><strong>200+ млн</strong><span>бюджета освоено</span></div>
                  </div>
                  <p class="article-author__offer"><span>Ведение вашего проекта</span><strong>от 30&nbsp;000&nbsp;₽</strong><span>в месяц</span></p>
                </div>
              </div>
            </div>
            <div class="article-author__page article-author__page--contact" aria-hidden="true" inert>
              <div class="article-author__contact-body">
                <p class="article-author__label">Связаться со мной</p>
                <p class="article-author__contact-title">Напишите мне</p>
                <p class="article-author__contact-copy">Расскажите о задаче - обсудим проект и подходящий формат консультации.</p>
                <div class="article-author__contacts" aria-label="Контакты Максима Мирошникова">
                  <a class="article-author__contact-link" href="mailto:direct@miroshnikov-maxim.ru"><span>Почта</span><b>direct@miroshnikov-maxim.ru</b></a>
                  <a class="article-author__contact-link" href="https://max.ru/u/f9LHodD0cOIgA7Bv0YjmbdPunU2SNMxoBHXbc-v6QicEIYa6pEGXQlYaqtE" target="_blank" rel="noopener noreferrer"><span>MAX</span><b>Открыть профиль</b></a>
                  <a class="article-author__contact-link" href="https://t.me/miroshnikov_maxim" target="_blank" rel="noopener noreferrer"><span>Telegram</span><b>@miroshnikov_maxim</b></a>
                </div>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </template>


  <script>
    const articles = [
      {
        slug: 'contextnaya-reklama-internet-magazina',
        tab: 'Стратегия',
        title: 'Контекстная реклама интернет-магазина: как получать продажи из Яндекс Директа',
        summary: 'Как запустить контекстную рекламу интернет-магазина: выбрать Товарную кампанию или ЕПК, подготовить фид, рассчитать бюджет, CPO и ДРР, оценить продажи.'
      },
      {
        slug: 'tovarnaya-kampaniya-yandex-direct',
        tab: 'Настройка',
        title: 'Товарная кампания в Яндекс Директе: как настроить фид и рекламу интернет-магазина',
        summary: 'Пошаговая настройка товарной кампании в Яндекс Директе: как создать и проверить YML-фид, выбрать товары, цели и бюджет для рекламы интернет-магазина.'
      },
      {
        slug: 'kak-otlichit-tovarnye-obyavleniya-s-kartinkoy-v-poiske',
        tab: 'Форматы',
        title: 'Как отличить товарные объявления с картинкой в поиске Яндекса',
        summary: 'Показываю, как по одному взгляду отличить РСЯ, Товарную галерею, органику и обычные поисковые объявления с картинкой в Яндексе.'
      }
    ];

    function articleHref(article) {
      return `../blog/${article.slug}/index.html`;
    }

    function rings() {
      const sheets = articles.map(function (article) {
        return `<li>
          <span class="ring-hardware" aria-hidden="true">
            <span class="ring-loop"></span>
          </span>
          <a class="sheet-link" href="${articleHref(article)}">
            <div><p class="topic">${article.tab}</p><h3>${article.title}</h3></div>
            <div class="sheet-copy">
              <p class="summary">${article.summary}</p>
              <span class="sheet-action" aria-hidden="true">Читать статью</span>
            </div>
          </a>
        </li>`;
      });
      return `<article class="article-ending" aria-label="Конец статьи">
        <div class="article-ending-author"></div>
        <div class="article-ending-related">
          <section class="ring-binding ring-linen" aria-labelledby="linen-title">
            <header class="section-heading">
              <h2 id="linen-title"><span class="linen-title-paper" aria-hidden="true"></span>Похожие статьи</h2>
              <span class="cup-mark" aria-hidden="true"></span>
            </header>
            <div class="ring-list">
              <span class="ring-spine" aria-hidden="true"></span>
              <ul>${sheets.join('')}</ul>
            </div>
          </section>
        </div>
      </article>`;
    }

    const stage = document.getElementById('stage');

    function mountArticleAuthor() {
      const host = stage.querySelector('.article-ending-author');
      const author = host.attachShadow({ mode: 'open' });
      author.append(document.getElementById('article-author-preview').content.cloneNode(true));

      const card = author.querySelector('.article-author');
      const toggle = card.querySelector('.article-author__toggle');
      const label = toggle.querySelector('.article-author__toggle-text');
      const profile = card.querySelector('.article-author__page--profile');
      const contacts = card.querySelector('.article-author__page--contact');
      toggle.addEventListener('click', function () {
        const showingContacts = card.classList.toggle('is-contact');
        toggle.setAttribute('aria-expanded', String(showingContacts));
        toggle.setAttribute('aria-label', showingContacts ? 'Показать информацию об авторе' : 'Показать контакты Максима Мирошникова');
        label.textContent = showingContacts ? 'Об авторе' : 'Задать вопрос';
        profile.setAttribute('aria-hidden', String(showingContacts));
        profile.inert = showingContacts;
        contacts.setAttribute('aria-hidden', String(!showingContacts));
        contacts.inert = !showingContacts;
      });
    }


    stage.innerHTML = rings();
    mountArticleAuthor();
  </script>
</body>
</html>
